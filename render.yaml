services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free

    dockerCommand: /app/deploy/render-entrypoint.sh node openclaw.mjs gateway --bind lan --port 10000 --allow-unconfigured
    healthCheckPath: /healthz

    envVars:
      # ============================================================
      # Render / OpenClaw Gateway
      # ============================================================

      - key: OPENCLAW_GATEWAY_PORT
        value: "10000"

      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw

      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace

      # Render generates and stores the Gateway token.
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true

      # Print the one-time dashboard owner URL in the Render logs.
      - key: OPENCLAW_RENDER_PRINT_DASHBOARD
        value: "true"

      # ============================================================
      # T Cloud / FilesLink persistence
      # ============================================================

      - key: FILESLINK_API_BASE_URL
        value: https://tcloud-2f7u.onrender.com

      - key: FILESLINK_BACKUP_INTERVAL_SECONDS
        value: "86400"

      - key: FILESLINK_RESTORE_ON_START
        value: "true"

      # ============================================================
      # Docker build memory
      # ============================================================

      - key: OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB
        value: "4096"

      - key: OPENCLAW_DOCKER_BUILD_NODE_OPTIONS
        value: "--max-old-space-size=4096"
