services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free

    dockerCommand: /app/deploy/render-entrypoint.sh node openclaw.mjs gateway --bind lan --allow-unconfigured

    # healthCheckPath intentionally disabled while debugging

    envVars:
      # Render's public HTTP port
      - key: OPENCLAW_GATEWAY_PORT
        value: "10000"

      # OpenClaw state
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw

      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace

      # Render generates the gateway token automatically
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true

      # T Cloud / FilesLink persistence
      - key: FILESLINK_API_BASE_URL
        value: https://tcloud-2f7u.onrender.com

      - key: FILESLINK_BACKUP_INTERVAL_SECONDS
        value: "86400"

      - key: FILESLINK_RESTORE_ON_START
        value: "true"

      # Build-time memory settings
      - key: OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB
        value: "4096"

      - key: OPENCLAW_DOCKER_BUILD_NODE_OPTIONS
        value: "--max-old-space-size=4096"
