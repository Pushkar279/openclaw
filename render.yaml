services:
  - type: web
    name: openclaw
    runtime: docker
    # Render Free does not support persistent disks. State is restored from
    # the external backup workflow described in docs/install/render.mdx.
    plan: free
    # The image CMD has no --allow-unconfigured, so a fresh ephemeral
    # filesystem must be allowed to boot before restore/configuration.
    dockerCommand: /app/deploy/render-entrypoint.sh node openclaw.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: FILESLINK_API_BASE_URL
        sync: false
      - key: FILESLINK_API_KEY
        sync: false
      - key: FILESLINK_CHANNEL_ID
        sync: false
      - key: FILESLINK_BACKUP_INTERVAL_SECONDS
        value: "86400"
      - key: FILESLINK_RESTORE_ON_START
        value: "true"
