services:
  - type: web
    name: openclaw
    runtime: docker
    # Render Free does not support persistent disks. State is restored from
    # the external backup workflow described in docs/install/render.mdx.
    plan: free
    # The entrypoint permits a fresh ephemeral filesystem to boot before
    # restore/configuration and binds the Gateway for Render ingress.
    dockerCommand: /app/deploy/render-entrypoint.sh node openclaw.mjs gateway --bind lan --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: FILESLINK_API_BASE_URL
        value: https://tcloud-2f7u.onrender.com
      - key: FILESLINK_BACKUP_INTERVAL_SECONDS
        value: "86400"
      - key: FILESLINK_RESTORE_ON_START
        value: "true"
      # Render's Docker build environment may hide its cgroup limit from tsdown.
      # These values are translated to Docker build args by Render.
      - key: OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB
        value: "4096"
      - key: OPENCLAW_DOCKER_BUILD_NODE_OPTIONS
        value: "--max-old-space-size=4096"
